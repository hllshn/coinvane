<!doctype html>
<!--
  Coinvane Play Store ekran görüntüsü şablonu (1080×1920).
  render.py, data.js'i (canlı fiyatlar, mumlar, kurlar, uygulamanın 11 dildeki metinleri) üretir ve
  her dil × ekran için bu sayfayı headless Chrome ile ?loc=<dil>&s=<1-6> parametreleriyle fotoğraflar.
  Uygulama ekranları res/layout ve res/values* ile aynı ölçü, renk ve metinleri kullanır.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Roboto:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;600;800&display=swap">
<style>
  :root {
    --brand-a:#4F6BFF; --brand-b:#7B3FE4;
    /* Uygulamanın koyu tema renkleri (values-night/colors.xml) */
    --surface:#0E1117; --card:#171B24; --on:#F1F3F9; --on2:#8C93A6; --brand:#AAB8FF; --brand-c:#24306B;
    --up:#2FD180; --down:#FF5C70; --up-c:rgba(47,209,128,.18); --down-c:rgba(255,92,112,.18);
    --ui: Roboto, "Noto Sans Arabic", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
    --head: "Bricolage Grotesque", Roboto, "Noto Sans Arabic", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing:border-box }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden }
  body { background:linear-gradient(155deg, var(--brand-a), var(--brand-b)); font-family:var(--ui); color:var(--on); position:relative }
  body::before { content:""; position:absolute; inset:0; background:radial-gradient(70% 45% at 85% 100%, rgba(47,209,128,.22), transparent 70%) }

  .cap { position:absolute; left:84px; right:84px; top:118px; display:flex; flex-direction:column; gap:22px }
  .cap h1 { margin:0; font-family:var(--head); font-weight:800; font-size:92px; line-height:1.02; letter-spacing:-.02em; text-wrap:balance }
  .cap p { margin:0; font-size:40px; line-height:1.3; color:rgba(241,243,249,.86); text-wrap:balance }

  .phone { position:absolute; left:120px; top:560px; width:840px; height:1700px; border-radius:96px; background:#1B2030; padding:18px;
           box-shadow:0 60px 120px rgba(8,10,30,.45), inset 0 0 0 2px rgba(255,255,255,.08) }
  .screen { position:relative; width:100%; height:100%; border-radius:80px; overflow:hidden; background:var(--surface) }
  /* Uygulama 412dp genişlikte çizilir, ekrana ölçeklenir */
  .app { position:absolute; left:0; top:0; width:412px; height:880px; transform:scale(1.9505); transform-origin:0 0; font-size:14px }

  .status { height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:500 }
  .status .ic { display:flex; gap:6px; align-items:center }
  .tb { height:64px; display:flex; align-items:center; padding:0 6px 0 16px; gap:4px }
  .tb .tt { flex:1; display:flex; flex-direction:column; min-width:0 }
  .tb .t1 { font-size:22px; font-weight:400 } .tb .t2 { font-size:12px; color:var(--on2); font-weight:500 }
  .ib { width:44px; height:44px; display:grid; place-items:center; flex:none }
  .ib svg { width:24px; height:24px; fill:var(--on) }
  .chips { display:flex; gap:8px; padding:4px 16px 8px; overflow:hidden }
  .chip { height:32px; padding:0 14px; border-radius:8px; border:1px solid #3A4152; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; white-space:nowrap; color:#C9CEDB }
  .chip.on { background:var(--brand-c); border-color:transparent; color:var(--on) }
  .chip.on::before { content:""; width:14px; height:9px; border-left:2px solid var(--on); border-bottom:2px solid var(--on); transform:rotate(-45deg) translateY(-2px); margin-inline-end:2px }

  .row { display:flex; align-items:center; min-height:72px; padding:10px 4px 10px 16px }
  .ico { width:40px; height:40px; border-radius:50%; flex:none; object-fit:contain }
  .who { flex:1; margin-inline-start:14px; min-width:0 }
  .sym { font-size:16px; font-weight:500 } .sub { font-size:12px; color:var(--on2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .val { display:flex; flex-direction:column; align-items:flex-end; gap:4px }
  .px { font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap }
  .pill { padding:3px 8px; border-radius:8px; font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; unicode-bidi:plaintext }
  .pill.up { color:var(--up); background:var(--up-c) } .pill.dn { color:var(--down); background:var(--down-c) }
  .star { width:44px; height:44px; display:grid; place-items:center; flex:none; margin-inline-start:4px }
  .star svg { width:24px; height:24px; fill:#C9CEDB } .star.on svg { fill:var(--brand) }

  .pad { padding:0 16px }
  .hero { display:flex; align-items:center; gap:14px }
  .big { font-size:30px; font-weight:400; font-variant-numeric:tabular-nums; white-space:nowrap }
  .card { background:var(--card); border-radius:12px }
  .stats { display:flex; padding:14px; margin-top:16px }
  .stat { flex:1; min-width:0 } .stat .l { font-size:12px; font-weight:500; color:var(--on2) } .stat .v { font-size:14px; font-weight:500; margin-top:2px; white-space:nowrap; font-variant-numeric:tabular-nums }
  .ints { display:flex; align-items:center; margin-top:16px; gap:4px }
  .seg { flex:1; display:flex; border:1px solid #3A4152; border-radius:20px; overflow:hidden; height:40px }
  .seg div { flex:1; display:grid; place-items:center; font-size:14px; font-weight:500; border-inline-start:1px solid #3A4152 }
  .seg div:first-child { border-inline-start:none } .seg .on { background:var(--brand-c) }
  .chartbox { margin-top:8px; height:300px; position:relative }
  .btn { height:44px; border-radius:22px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; margin-top:12px }
  .btn svg { width:18px; height:18px; fill:currentColor }
  .tonal { background:var(--brand-c); color:#E0E5FF } .outl { border:1px solid #3A4152; color:var(--brand) }
  .hold { display:flex; align-items:center; padding:14px; margin-top:16px }
  .hold .t { flex:1 } .hold .l { font-size:12px; color:var(--on2); font-weight:500 } .hold .v { font-size:16px; font-weight:500; margin:2px 0 } .hold .a { font-size:12px; color:var(--on2) }
  .achips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px }
  .achip { height:32px; padding:0 8px 0 12px; border-radius:8px; border:1px solid #3A4152; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500 }
  .achip svg { width:18px; height:18px; fill:var(--on2) }
  .ttl { font-size:14px; font-weight:500; margin-top:16px }

  .note { position:absolute; left:10px; right:10px; top:44px; background:#262B38; border-radius:22px; padding:14px 16px; box-shadow:0 12px 30px rgba(0,0,0,.5); z-index:5 }
  .note .h { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--on2) }
  .note .h svg { width:16px; height:16px }
  .note .nt { font-size:15px; font-weight:500; margin-top:8px } .note .nb { font-size:14px; color:#C9CEDB; margin-top:2px }

  .sum { margin:4px 16px 0; padding:20px; border-radius:12px; background:var(--brand-c) }
  .sum .l { font-size:14px; color:#E0E5FF; font-weight:500 } .sum .v { font-size:30px; margin-top:4px; font-variant-numeric:tabular-nums; color:#E0E5FF }
  .sum .ps { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }

  .home { position:absolute; inset:0; background:radial-gradient(120% 70% at 20% 10%, #3B4BC4, transparent 60%), radial-gradient(90% 60% at 100% 100%, #5E2DB8, transparent 60%), #141833 }
  .clock { text-align:center; margin-top:36px; font-size:72px; font-weight:300; letter-spacing:-1px } .date { text-align:center; font-size:15px; color:#DDE2F5; margin-top:2px }
  .widget { margin:28px 18px 0; background:#171B24; border-radius:22px; padding:16px }
  .wh { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700 } .wh .tm { margin-inline-start:auto; font-weight:400; font-size:11px; color:var(--on2) }
  .wr { display:flex; align-items:center; margin-top:10px; font-size:14px } .wr .b { flex:1; font-weight:700 } .wr .p { font-variant-numeric:tabular-nums } .wr .c { width:70px; text-align:end; font-size:12px; font-variant-numeric:tabular-nums }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:26px 0; margin:40px 26px 0; justify-items:center }
  .appi { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.14) }
  .appi.cv { background:none }
  .dock { position:absolute; left:26px; right:26px; bottom:34px; height:84px; border-radius:42px; background:rgba(255,255,255,.12); display:flex; justify-content:space-around; align-items:center }

  .set { padding:14px 24px } .set .k { font-size:16px } .set .v { font-size:14px; color:var(--on2); margin-top:2px }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:4 }
  .dlg { position:absolute; left:28px; right:28px; top:150px; background:#20242F; border-radius:28px; padding:22px 0 12px; z-index:5 }
  .dlg h3 { margin:0 24px 12px; font-size:22px; font-weight:400 }
  .opt { display:flex; align-items:center; gap:16px; padding:10px 24px; font-size:15px }
  .radio { width:20px; height:20px; border-radius:50%; border:2px solid #8C93A6; flex:none; position:relative }
  .radio.on { border-color:var(--brand) } .radio.on::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brand) }
</style>
</head>
<body>
<div class="cap"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><div class="screen"><div class="app" id="app"></div></div></div>
<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const LOC = q.get('loc') || 'en-US', SHOT = +(q.get('s') || 1);
const L = DATA.locales[LOC], S = L.strings, CODE = L.currency, RATE = DATA.fx[CODE] || 1;
const TAG = L.tag; // BCP-47 etiketi (biçimlendirme için)
document.documentElement.lang = TAG;
if (L.rtl) document.documentElement.dir = 'rtl';

// --- Uygulamadaki Money / Format sınıflarının karşılığı ---
function fmtCur(v, maxFrac) {
  const o = { style: 'currency', currency: CODE };
  if (maxFrac !== undefined) { o.minimumFractionDigits = 0; o.maximumFractionDigits = maxFrac; }
  else if (Math.abs(v) < 1 && v !== 0) { o.minimumFractionDigits = 4; o.maximumFractionDigits = 8; }
  return new Intl.NumberFormat(TAG, o).format(v);
}
const price = usd => fmtCur(usd * RATE);
function compact(usd) {
  const v = usd * RATE, a = Math.abs(v);
  const u = a >= 1e12 ? 4 : a >= 1e9 ? 3 : a >= 1e6 ? 2 : a >= 1e3 ? 1 : 0;
  if (!u) return fmtCur(v);
  const s = fmtCur(v / Math.pow(1000, u), 2);
  const m = s.match(/.*\p{Nd}/u); // son rakamdan sonra son eki koy
  return m ? m[0] + S.compact_suffixes[u - 1] + s.slice(m[0].length) : s + S.compact_suffixes[u - 1];
}
const pct = p => (p >= 0 ? '+' : '-') + new Intl.NumberFormat(TAG, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(p)) + '%';
const signed = v => (v < 0 ? '−' : '+') + fmtCur(Math.abs(v));
const f = (s, ...a) => s.replace(/%(\d)\$s/g, (_, i) => a[i - 1]).replace(/%d/g, a[0]);
const num = (v, d) => new Intl.NumberFormat(TAG, { maximumFractionDigits: d }).format(v);

const ICON = {
  search: '<path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>',
  portfolio: '<path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>',
  settings: '<path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>',
  back: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>',
  star: '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>',
  starO: '<path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/>',
  bell: '<path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6zm-3-9h-2v2H9v2h2v2h2v-2h2v-2h-2z"/>',
  line: '<path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>',
  close: '<path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>',
  bat: '<path d="M16 7H8a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zm3 3h1v4h-1z"/>',
  wifi: '<path d="M12 21l3.6-4.5A6 6 0 0 0 12 15a6 6 0 0 0-3.6 1.5L12 21zM2 8.5l2 2.5a12.5 12.5 0 0 1 16 0l2-2.5A15.7 15.7 0 0 0 2 8.5zm4 5l2 2.5a6.3 6.3 0 0 1 8 0l2-2.5a9.5 9.5 0 0 0-12 0z"/>',
};
const svg = (n, cls) => '<svg viewBox="0 0 24 24"' + (cls ? ' class="' + cls + '"' : '') + '>' + ICON[n] + '</svg>';
const LOGO = '<svg viewBox="27 27 54 54" width="SZ" height="SZ"><path d="M73.03 45.13A21 21 0 1 1 62.87 34.97" fill="none" stroke="#AAB8FF" stroke-width="5" stroke-linecap="round"/><path d="M49.8 58.2L66.7 41.3" stroke="#AAB8FF" stroke-width="4.5" stroke-linecap="round"/><path d="M51.2 56.8L46.9 69.6L45.5 62.5L38.4 61.1Z" fill="#AAB8FF"/><path d="M76.6 31.4L71.7 47.6L60.4 36.3Z" fill="#2FD180"/></svg>';
const ICONAPP = '<svg viewBox="18 18 72 72" width="58" height="58"><defs><linearGradient id="ag" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#7B3FE4"/></linearGradient><clipPath id="ac"><circle cx="54" cy="54" r="36"/></clipPath></defs><g clip-path="url(#ac)"><rect width="108" height="108" fill="url(#ag)"/></g><path d="M73.03 45.13A21 21 0 1 1 62.87 34.97" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M49.8 58.2L66.7 41.3" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M51.2 56.8L46.9 69.6L45.5 62.5L38.4 61.1Z" fill="#fff"/><path d="M76.6 31.4L71.7 47.6L60.4 36.3Z" fill="#2FD180"/></svg>';

const coin = s => DATA.coins.find(c => c.base === s);
const chg = c => (c.last - c.open) / c.open * 100;
const icon = b => '<img class="ico" src="' + DATA.icons[b] + '" alt="">';
const status = () => '<div class="status"><span>9:41</span><span class="ic">' + svg('wifi').replace('<svg', '<svg width="16" height="16" fill="#F1F3F9"') + svg('bat').replace('<svg', '<svg width="18" height="18" fill="#F1F3F9"') + '</span></div>';
const pill = p => '<span class="pill ' + (p >= 0 ? 'up' : 'dn') + '">' + pct(p) + '</span>';
const FAV = ['BTC', 'ETH', 'SOL', 'XRP', 'BNB', 'DOGE', 'LINK', 'ADA', 'SUI'];

function listRow(c, fav) {
  const vol = f(S.volume_short, compact(c.qv));
  return '<div class="row">' + icon(c.base) + '<div class="who"><div class="sym">' + c.base + '</div><div class="sub">' + (c.name !== c.base ? c.name + ' · ' : '') + vol + '</div></div>' +
    '<div class="val"><div class="px">' + price(c.last) + '</div>' + pill(chg(c)) + '</div><div class="star' + (fav ? ' on' : '') + '">' + svg(fav ? 'star' : 'starO') + '</div></div>';
}

function screenList() {
  const live = f(S.status_live, DATA.pairs);
  let rows = '';
  FAV.map(coin).sort((a, b) => b.qv - a.qv).forEach(c => rows += listRow(c, true));
  return status() + '<div class="tb"><div class="tt"><div class="t1">Coinvane</div><div class="t2">' + live + '</div></div>' +
    '<div class="ib">' + svg('search') + '</div><div class="ib">' + svg('portfolio') + '</div><div class="ib">' + svg('settings') + '</div></div>' +
    '<div class="chips"><div class="chip">' + S.tab_all + '</div><div class="chip on">' + S.tab_favorites + '</div><div class="chip">' + S.tab_gainers + '</div><div class="chip">' + S.tab_losers + '</div></div>' + rows;
}

function chartSvg(w, h) {
  const K = DATA.candles.slice(-48), n = K.length;
  let lo = Infinity, hi = -Infinity, vm = 0;
  K.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); vm = Math.max(vm, k.v); });
  const pad = (hi - lo) * 0.08; lo -= pad * 3.2; hi += pad; // alt %35: hacim
  const plotW = w - 58, x = i => 4 + (i + 0.5) * plotW / n, y = v => h - 22 - (v - lo) / (hi - lo) * (h - 30);
  let g = '', ax = '';
  for (let i = 0; i < 5; i++) {
    const v = lo + (hi - lo) * (0.35 + i * 0.16), yy = y(v);
    g += '<line x1="0" x2="' + plotW + '" y1="' + yy + '" y2="' + yy + '" stroke="rgba(255,255,255,.12)" stroke-width="0.6"/>';
    ax += '<text x="' + (plotW + 6) + '" y="' + (yy + 3.5) + '" font-size="9.5" fill="#8C93A6">' + num(v * RATE, v * RATE >= 1000 ? 0 : 2) + '</text>';
  }
  let c = '';
  const bw = plotW / n * 0.72;
  K.forEach((k, i) => {
    const up = k.c >= k.o, col = up ? '#2FD180' : '#FF5C70', cx = x(i);
    const vh = k.v / vm * (h * 0.25);
    c += '<rect x="' + (cx - bw / 2) + '" y="' + (h - 22 - vh) + '" width="' + bw + '" height="' + vh + '" fill="' + col + '" opacity=".33"/>';
    c += '<line x1="' + cx + '" x2="' + cx + '" y1="' + y(k.h) + '" y2="' + y(k.l) + '" stroke="' + col + '" stroke-width="1"/>';
    c += '<rect x="' + (cx - bw / 2) + '" y="' + y(Math.max(k.o, k.c)) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(y(k.o) - y(k.c))) + '" fill="' + col + '"/>';
  });
  const tf = new Intl.DateTimeFormat(TAG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  let xl = '';
  [6, 20, 34].forEach(i => { xl += '<text x="' + x(i) + '" y="' + (h - 6) + '" font-size="9.5" fill="#8C93A6" text-anchor="middle">' + tf.format(new Date(K[i].t)) + '</text>'; });
  return '<svg width="' + w + '" height="' + h + '" style="direction:ltr">' + g + c + ax + xl + '</svg>';
}

function detailTop(c, fav) {
  return status() + '<div class="tb"><div class="ib">' + svg('back') + '</div><div class="tt"><div class="t1">' + c.name + '</div><div class="t2">' + c.base + '</div></div><div class="ib">' + svg(fav ? 'star' : 'starO').replace('<svg', '<svg style="fill:#AAB8FF"') + '</div></div>' +
    '<div class="pad"><div class="hero">' + icon(c.base).replace('class="ico"', 'class="ico" style="width:44px;height:44px"') + '<div><div class="big">' + price(c.last) + '</div>' + pill(chg(c)) + '</div></div>' +
    '<div class="card stats"><div class="stat"><div class="l">' + S.high_24h + '</div><div class="v">' + price(c.high) + '</div></div>' +
    '<div class="stat"><div class="l">' + S.low_24h + '</div><div class="v">' + price(c.low) + '</div></div>' +
    '<div class="stat"><div class="l">' + S.volume_24h + '</div><div class="v">' + compact(c.qv) + '</div></div></div>';
}

function screenChart() {
  const c = coin('BTC'), h = DATA.holding;
  return detailTop(c, true) +
    '<div class="ints"><div class="seg"><div>' + S.interval_15m + '</div><div class="on">' + S.interval_1h + '</div><div>' + S.interval_4h + '</div><div>' + S.interval_1d + '</div><div>' + S.interval_1w + '</div></div><div class="ib">' + svg('line').replace('<svg', '<svg style="fill:#AAB8FF"') + '</div></div>' +
    '<div class="chartbox">' + chartSvg(380, 300) + '</div>' +
    '<div class="card hold"><div class="t"><div class="l">' + S.holding_title + '</div><div class="v">' + price(h.amount * c.last) + '</div><div class="a">' + f(S.holding_amount_value, num(h.amount, 8), 'BTC') + '</div></div>' +
    pill(((c.last - h.cost) / h.cost) * 100).replace(/>[^<]*</, '>' + f(S.profit_value, signed(h.amount * (c.last - h.cost) * RATE), pct((c.last - h.cost) / h.cost * 100)) + '<') + '</div></div>';
}

function screenAlerts() {
  const c = coin('BTC');
  const tAbove = Math.ceil(c.last * RATE * 1.0012 / roundTo()) * roundTo(), tBelow = Math.floor(c.last * RATE * 0.95 / roundTo()) * roundTo();
  const now = tAbove * 1.0004;
  const note = '<div class="note"><div class="h">' + LOGO.replace(/SZ/g, '16') + '<span>Coinvane · ' + S.alert_channel_name + '</span></div>' +
    '<div class="nt">' + f(S.alert_title, 'BTC') + '</div><div class="nb">' + f(S.alert_text_above, fmtCur(tAbove), fmtCur(now)) + '</div></div>';
  const chip = (t, s) => '<div class="achip">' + f(s, fmtCur(t)) + svg('close') + '</div>';
  return note + detailTop(c, true) +
    '<div class="ints"><div class="seg"><div>' + S.interval_15m + '</div><div>' + S.interval_1h + '</div><div class="on">' + S.interval_4h + '</div><div>' + S.interval_1d + '</div><div>' + S.interval_1w + '</div></div><div class="ib">' + svg('line').replace('<svg', '<svg style="fill:#AAB8FF"') + '</div></div>' +
    '<div class="chartbox" style="height:220px">' + chartSvg(380, 220) + '</div>' +
    '<div class="ttl">' + S.alerts_title + '</div><div class="achips">' + chip(tBelow, S.alert_chip_below) + chip(Math.round(c.last * RATE * 1.06 / roundTo()) * roundTo(), S.alert_chip_above) + '</div>' +
    '<div class="btn tonal">' + svg('bell') + S.set_alert + '</div><div class="btn outl">' + svg('portfolio') + S.holding_edit + '</div></div>';
}
function roundTo() { const v = DATA.coins[0].last * RATE; return Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 2)); }

function screenPortfolio() {
  let val = 0, cost = 0, ch = 0, rows = '';
  const hs = DATA.portfolio.map(h => { const c = coin(h.base); return { h, c, v: h.amount * c.last }; }).sort((a, b) => b.v - a.v);
  hs.forEach(({ h, c, v }) => {
    val += v; cost += h.amount * h.cost; ch += h.amount * (c.last - c.open);
    const p = (c.last - h.cost) / h.cost * 100;
    rows += '<div class="row" style="padding-inline-end:16px">' + icon(c.base) + '<div class="who"><div class="sym">' + c.base + '</div><div class="sub">' + f(S.holding_amount_value, num(h.amount, 8), c.base) + '</div></div>' +
      '<div class="val"><div class="px">' + price(v) + '</div>' + pill(p) + '</div></div>';
  });
  const prof = val - cost, prev = val - ch;
  const p24 = '<span class="pill ' + (ch >= 0 ? 'up' : 'dn') + '">' + f(S.change_24h_value, signed(ch * RATE), pct(ch / prev * 100)) + '</span>';
  const ppl = '<span class="pill ' + (prof >= 0 ? 'up' : 'dn') + '">' + f(S.profit_value, signed(prof * RATE), pct(prof / cost * 100)) + '</span>';
  return status() + '<div class="tb"><div class="ib">' + svg('back') + '</div><div class="tt"><div class="t1">' + S.portfolio + '</div></div></div>' +
    '<div class="sum"><div class="l">' + S.portfolio_total + '</div><div class="v">' + price(val) + '</div><div class="ps">' + p24 + ppl + '</div></div>' + '<div style="height:8px"></div>' + rows;
}

function screenWidget() {
  const tf = new Intl.DateTimeFormat(TAG, { hour: '2-digit', minute: '2-digit' });
  const df = new Intl.DateTimeFormat(TAG, { weekday: 'long', day: 'numeric', month: 'long' });
  const d = new Date(DATA.time); d.setHours(9, 41, 0, 0); // durum çubuğuyla aynı saat
  let w = '';
  ['BTC', 'ETH', 'SOL', 'XRP'].map(coin).forEach(c => {
    const p = chg(c);
    w += '<div class="wr"><span class="b">' + c.base + '</span><span class="p">' + price(c.last) + '</span><span class="c" style="color:' + (p >= 0 ? '#2FD180' : '#FF5C70') + '">' + pct(p) + '</span></div>';
  });
  let apps = '';
  for (let i = 0; i < 8; i++) apps += i === 5 ? '<div class="appi cv">' + ICONAPP + '</div>' : '<div class="appi"></div>';
  return '<div class="home">' + status() + '<div class="clock">' + tf.format(d) + '</div><div class="date">' + df.format(d) + '</div>' +
    '<div class="widget"><div class="wh">' + LOGO.replace(/SZ/g, '18') + '<span>Coinvane</span><span class="tm">' + tf.format(d) + '</span></div>' + w + '</div>' +
    '<div class="grid">' + apps + '</div><div class="dock"><div class="appi"></div><div class="appi"></div><div class="appi"></div><div class="appi"></div></div></div>';
}

function screenSettings() {
  const dn = new Intl.DisplayNames([TAG], { type: 'currency' });
  const sym = code => (new Intl.NumberFormat(TAG, { style: 'currency', currency: code }).formatToParts(0).find(p => p.type === 'currency') || {}).value;
  const label = code => code + ' · ' + dn.of(code) + ' (' + sym(code) + ')';
  const list = [CODE].concat(['USD', 'EUR', 'GBP', 'TRY', 'JPY', 'KRW', 'BRL', 'INR'].filter(c => c !== CODE)).slice(0, 7);
  list.sort((a, b) => DATA.currencies.indexOf(a) - DATA.currencies.indexOf(b));
  let opts = '';
  list.forEach(c => opts += '<div class="opt"><div class="radio' + (c === CODE ? ' on' : '') + '"></div>' + label(c) + '</div>');
  return status() + '<div class="tb"><div class="ib">' + svg('back') + '</div><div class="tt"><div class="t1">' + S.settings + '</div></div></div>' +
    '<div class="set"><div class="k">' + S.settings_language + '</div><div class="v">' + L.languageName + '</div></div>' +
    '<div class="set"><div class="k">' + S.settings_currency + '</div><div class="v">' + label(CODE) + '</div></div>' +
    '<div class="set"><div class="k">' + S.settings_theme + '</div><div class="v">' + S.theme_options[0] + '</div></div>' +
    '<div class="scrim"></div><div class="dlg"><h3>' + S.settings_currency + '</h3>' + opts + '</div>';
}

const SCREENS = [screenList, screenChart, screenAlerts, screenPortfolio, screenWidget, screenSettings];
document.getElementById('app').innerHTML = SCREENS[SHOT - 1]();
document.getElementById('h').textContent = L.captions[SHOT - 1][0];
document.getElementById('p').textContent = L.captions[SHOT - 1][1];
</script>
</body>
</html>
