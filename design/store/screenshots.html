<!doctype html>
<!--
  Coinvane Play Store ekran görüntüsü şablonu (1080×1920; tablet: 1920×1080), v8 arayüzü.
  render.py, data.js'i (canlı fiyatlar, piyasa hareketi, dönem verisi, mumlar, kurlar, uygulamanın 11 dildeki metinleri)
  üretir ve her dil × ekran için bu sayfayı headless Chrome ile ?loc=<dil>&s=<1-6> parametreleriyle fotoğraflar.
  Uygulama ekranları res/layout, res/values*/colors.xml ve strings.xml ile aynı ölçü, renk ve metinleri kullanır.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Roboto:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;600;800&display=swap">
<style>
  :root {
    --brand-a:#7A6FF0; --brand-b:#3A2E9E;
    /* Uygulamanın koyu tema renkleri (values-night/colors.xml, v8) */
    --surface:#0C1019; --card:#171C29; --card-hi:#1E2434; --on:#E9EBF2; --on2:#8C93A6; --brand:#9A91F5; --brand-s:#6E63DB;
    --brand-c:#2A2656; --divider:#1C2231; --outline:#2B3245;
    --up:#2FD180; --down:#FF5C70; --up-c:rgba(47,209,128,.18); --down-c:rgba(255,92,112,.18); --nt-c:rgba(140,147,166,.18);
    --ui: Roboto, "Noto Sans Arabic", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
    --head: "Bricolage Grotesque", Roboto, "Noto Sans Arabic", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing:border-box }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden }
  body { background:linear-gradient(155deg, var(--brand-a), var(--brand-b)); font-family:var(--ui); color:var(--on); position:relative }
  body::before { content:""; position:absolute; inset:0; background:radial-gradient(70% 45% at 85% 100%, rgba(47,209,128,.20), transparent 70%) }

  .cap { position:absolute; left:84px; right:84px; top:118px; display:flex; flex-direction:column; gap:22px }
  .cap h1 { margin:0; font-family:var(--head); font-weight:800; font-size:88px; line-height:1.02; letter-spacing:-.02em; text-wrap:balance; word-break:keep-all; overflow-wrap:anywhere }
  /* keep-all: Çince/Japonca başlıklar kelime ortasından değil noktalamadan bölünür */
  .cap p { margin:0; font-size:38px; line-height:1.3; color:rgba(241,243,249,.88); text-wrap:balance }

  .phone { position:absolute; left:120px; top:560px; width:840px; height:1700px; border-radius:96px; background:#1B2030; padding:18px;
           box-shadow:0 60px 120px rgba(8,10,30,.45), inset 0 0 0 2px rgba(255,255,255,.08) }
  .screen { position:relative; width:100%; height:100%; border-radius:80px; overflow:hidden; background:var(--surface) }
  /* Uygulama 412dp genişlikte çizilir, ekrana ölçeklenir; yükseklik görüntüde görünen kısım kadar (alt menü görünsün) */
  .app { position:absolute; left:0; top:0; width:412px; height:688px; transform:scale(1.9505); transform-origin:0 0; font-size:14px; overflow:hidden }

  svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none }
  .status { height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:500 }
  .status .ic { display:flex; gap:6px; align-items:center }
  .hdr { height:56px; display:flex; align-items:center; padding-inline:16px 4px; gap:0 }
  .hdr .t { flex:1; font-size:22px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hdr .logo { display:flex; align-items:center; gap:8px; flex:1; font-size:22px; font-weight:700 }
  .ib { width:48px; height:48px; display:grid; place-items:center; flex:none; color:var(--on) }
  .cap2 { font-size:12px; color:var(--on2) }
  .pad { padding:0 16px }
  .card { background:var(--card); border-radius:14px }
  .sec { font-size:16px; font-weight:700 }

  .chips { display:flex; gap:8px; padding:0 16px; overflow:hidden }
  .chip { height:36px; padding:0 12px; border-radius:12px; border:1px solid var(--outline); display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; white-space:nowrap; flex:none }
  .chip svg.i { width:18px; height:18px }
  .chip.on { background:var(--brand-s); border-color:var(--brand-s); color:#fff }
  .per { display:flex; margin:8px 16px 0; padding:4px; border-radius:12px; background:var(--card) }
  .per div { flex:1; text-align:center; height:32px; line-height:32px; border-radius:10px; font-size:14px; font-weight:500; color:var(--on2); white-space:nowrap }
  .per .on { background:var(--brand-s); color:#fff }

  .row { display:flex; align-items:center; min-height:70px; padding-block:8px; padding-inline:16px 4px; border-bottom:1px solid var(--divider) }
  .ico { width:34px; height:34px; border-radius:50%; flex:none; object-fit:contain }
  .ph { width:34px; height:34px; border-radius:50%; flex:none; background:var(--card-hi); color:var(--on2); display:grid; place-items:center; font-size:11px; font-weight:700 }
  .who { flex:1; margin-inline-start:12px; min-width:0 }
  .sym { font-size:15px; font-weight:700 } .sub { font-size:12px; color:var(--on2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .sp { width:48px; height:24px; margin:0 8px; flex:none; direction:ltr }
  .val { display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:84px }
  .px { font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap }
  .pill { padding:3px 8px; border-radius:8px; font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; unicode-bidi:plaintext }
  .pill.up { color:var(--up); background:var(--up-c) } .pill.dn { color:var(--down); background:var(--down-c) } .pill.nt { color:var(--on2); background:var(--nt-c) }
  .star { width:44px; height:48px; display:grid; place-items:center; flex:none; color:var(--on2) }
  .star.on { color:var(--brand) } .star.on svg.i { fill:var(--brand) }

  .nav { position:absolute; left:0; right:0; bottom:0; height:65px; display:flex; background:var(--surface); border-top:1px solid var(--divider); z-index:3 }
  .nav div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12px; font-weight:500; color:var(--on2); white-space:nowrap }
  .nav .on { color:var(--brand) }

  .ov { display:flex; margin:12px 16px 0; padding:14px 0 }
  .ov .c { flex:1; padding:0 16px; min-width:0 } .ov .c + .c { border-inline-start:1px solid var(--divider) }
  .ov .s { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--on2) } .ov .s img { width:20px; height:20px }
  .ov .p { font-size:18px; font-weight:700; margin:4px 0; white-space:nowrap; font-variant-numeric:tabular-nums }
  .mvh { display:flex; align-items:center; padding:12px 16px 4px } .mvh > div { flex:1 }
  .mv { display:flex; margin:4px 16px 0; padding:12px 0 }
  .mv > div { flex:1; text-align:center } .mv > div + div { border-inline-start:1px solid var(--divider) }
  .mv .n { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center; gap:4px }
  .mv .n svg.i { width:18px; height:18px }
  .cols { display:flex; align-items:center; height:40px; padding-inline:16px 48px; color:var(--on2); font-size:12px; border-bottom:1px solid var(--divider); margin-top:4px }
  .cols div:first-child { flex:1 } .cols div + div { margin-inline-start:16px; display:flex; align-items:center; gap:2px }
  .cols svg.i { width:14px; height:14px }

  .tb { height:64px; display:flex; align-items:center; padding-inline:4px; gap:4px }
  .tb .tt { flex:1; min-width:0 } .tb .t1 { font-size:22px } .tb .t2 { font-size:12px; color:var(--on2) }
  .hero { display:flex; align-items:center; gap:12px }
  .big { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap }
  .perf { display:flex; padding:4px; margin-top:6px }
  .perf div { flex:1; text-align:center; padding:6px 0; border-radius:10px; min-width:0 }
  .perf .l { font-size:11px; color:var(--on2) } .perf .v { font-size:11px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums; white-space:nowrap }
  .perf .on { background:var(--brand-c); outline:1px solid var(--brand-s) }
  .stats { display:flex; padding:14px; margin-top:12px }
  .stat { flex:1; min-width:0 } .stat .l { font-size:12px; color:var(--on2) } .stat .v { font-size:13px; font-weight:500; margin-top:2px; white-space:nowrap; font-variant-numeric:tabular-nums }
  .ints { display:flex; align-items:center; margin-top:12px; gap:4px }
  .seg { flex:1; display:flex; border:1px solid var(--outline); border-radius:20px; overflow:hidden; height:40px }
  .seg div { flex:1; display:grid; place-items:center; font-size:14px; font-weight:500; border-inline-start:1px solid var(--outline) }
  .seg div:first-child { border-inline-start:none } .seg .on { background:var(--brand-c) }
  .chartbox { margin-top:6px; position:relative }
  .achips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px }
  .achip { height:32px; padding:0 8px 0 12px; border-radius:8px; border:1px solid var(--outline); display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500 }
  .achip svg.i { width:16px; height:16px; color:var(--on2) }
  .btn { height:48px; border-radius:24px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; margin-top:10px }
  .btn svg.i { width:18px; height:18px }
  .prim { background:var(--brand-s); color:#fff } .outl { border:1px solid var(--outline) }

  .note { position:absolute; left:10px; right:10px; top:8px; background:#262B38; border-radius:22px; padding:14px 16px; box-shadow:0 12px 30px rgba(0,0,0,.5); z-index:5 }
  .note .h { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--on2) }
  .note .nt { font-size:15px; font-weight:500; margin-top:8px } .note .nb { font-size:14px; color:#C9CEDB; margin-top:2px }

  .sum { margin:4px 16px 0; padding:16px }
  .sum .top { display:flex; font-size:12px; color:var(--on2) } .sum .top div:first-child { flex:1 }
  .sum .v { font-size:28px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums }
  .sum hr { border:0; border-top:1px solid var(--divider); margin:12px 0 }
  .kv { display:flex; align-items:center; font-size:14px; color:var(--on2); margin-top:8px } .kv b { margin-inline-start:auto; font-weight:500; font-variant-numeric:tabular-nums; unicode-bidi:plaintext }
  .tabs { display:flex; align-items:center; gap:8px; padding:16px 8px 4px 16px } .tabs .add { margin-inline-start:auto; display:flex; align-items:center; gap:4px; color:var(--brand); font-size:14px; font-weight:500 }
  .tabs .add svg.i { width:18px; height:18px }

  .home { position:absolute; inset:0; background:radial-gradient(120% 70% at 20% 10%, #4A3FC4, transparent 60%), radial-gradient(90% 60% at 100% 100%, #2E2A7A, transparent 60%), #12142E }
  .clock { text-align:center; margin-top:36px; font-size:72px; font-weight:300; letter-spacing:-1px } .date { text-align:center; font-size:15px; color:#DDE2F5; margin-top:2px }
  .widget { margin:28px 18px 0; background:#171C29; border-radius:22px; padding:16px }
  .wh { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700 } .wh .tm { margin-inline-start:auto; font-weight:400; font-size:11px; color:var(--on2) }
  .wr { display:flex; align-items:center; margin-top:10px; font-size:14px } .wr .b { flex:1; font-weight:700 } .wr .p { font-variant-numeric:tabular-nums } .wr .c { width:70px; text-align:end; font-size:12px; font-variant-numeric:tabular-nums }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:26px 0; margin:40px 26px 0; justify-items:center }
  .appi { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.14) } .appi.cv { background:none }
  .dock { position:absolute; left:26px; right:26px; bottom:34px; height:84px; border-radius:42px; background:rgba(255,255,255,.12); display:flex; justify-content:space-around; align-items:center }

  .grp { margin:8px 16px 0 } .gl { font-size:12px; color:var(--on2); margin:12px 20px 0 }
  .set { display:flex; align-items:center; gap:16px; min-height:56px; padding:8px 12px 8px 16px; border-bottom:1px solid var(--divider) } .set:last-child { border-bottom:none }
  .set svg.i { color:var(--on2) } .set .k { flex:1; font-size:16px } .set .v { font-size:14px; color:var(--on2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px }
  .set .ch { width:20px; height:20px; color:var(--on2) }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:4 }
  .dlg { position:absolute; left:28px; right:28px; top:150px; background:var(--card-hi); border-radius:28px; padding:22px 0 12px; z-index:5 }
  .dlg h3 { margin:0 24px 12px; font-size:22px; font-weight:400 }
  .opt { display:flex; align-items:center; gap:16px; padding:10px 24px; font-size:15px }
  .radio { width:20px; height:20px; border-radius:50%; border:2px solid var(--on2); flex:none; position:relative }
  .radio.on { border-color:var(--brand) } .radio.on::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brand) }

  /* Yatay tablet modu (?dev=tablet): 1920×1080 tuval; 10 inç için 4/3 ölçekle 2560×1440 alınır */
  body.tablet, html.tablet { width:1920px; height:1080px }
  body.tablet .cap { left:80px; right:auto; width:580px; top:0; bottom:0; justify-content:center }
  body.tablet .cap h1 { font-size:68px }
  body.tablet .cap p { font-size:32px }
  body.tablet .phone { left:680px; top:150px; width:1160px; height:780px; border-radius:48px; padding:20px }
  body.tablet .screen { border-radius:30px }
  body.tablet .app { width:900px; height:595px; transform:scale(1.2444) }
  body.tablet .dlg { left:50%; right:auto; width:420px; margin-left:-210px; top:60px }
  body.tablet .widget { width:420px; margin:24px auto 0 }
  body.tablet .grid { width:600px; margin:28px auto 0; grid-template-columns:repeat(8, 1fr) }
  body.tablet .clock { margin-top:20px }
  body.tablet .note { left:auto; right:16px; width:420px }
</style>
</head>

<div class="cap"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><div class="screen"><div class="app" id="app"></div></div></div>
<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const LOC = q.get('loc') || 'en-US', SHOT = +(q.get('s') || 1);
const TABLET = q.get('dev') === 'tablet';
if (TABLET) { document.documentElement.classList.add('tablet'); document.body.classList.add('tablet'); }
const CW = TABLET ? 868 : 380; // grafik genişliği (dp)
const L = DATA.locales[LOC], S = L.strings, CODE = L.currency, RATE = DATA.fx[CODE] || 1;
const TAG = L.tag; // BCP-47 etiketi (biçimlendirme için)
document.documentElement.lang = TAG;
if (L.rtl) document.documentElement.dir = 'rtl';

// --- Uygulamadaki Money / Format sınıflarının karşılığı ---
function fmtCur(v, maxFrac) {
  const o = { style: 'currency', currency: CODE };
  if (maxFrac !== undefined) { o.minimumFractionDigits = 0; o.maximumFractionDigits = maxFrac; }
  else if (Math.abs(v) < 1 && v !== 0) { // v8: en az 4 anlamlı hane, sıfıra yuvarlanmaz
    const lead = Math.ceil(-Math.log10(Math.abs(v)));
    o.minimumFractionDigits = 4; o.maximumFractionDigits = Math.min(12, Math.max(4, lead + 3));
  }
  return new Intl.NumberFormat(TAG, o).format(v);
}
const price = usd => fmtCur(usd * RATE);
function compact(usd) {
  const v = usd * RATE, a = Math.abs(v);
  const u = a >= 1e12 ? 4 : a >= 1e9 ? 3 : a >= 1e6 ? 2 : a >= 1e3 ? 1 : 0;
  if (!u) return fmtCur(v);
  const s = fmtCur(v / Math.pow(1000, u), 2);
  const m = s.match(/.*\p{Nd}/u); // son rakamdan sonra son eki koy
  return m ? m[0] + S.compact_suffixes[u - 1] + s.slice(m[0].length) : s + S.compact_suffixes[u - 1];
}
const dir = p => Math.abs(p) < 0.005 ? 0 : p > 0 ? 1 : -1;
const pct = p => dir(p) === 0 ? new Intl.NumberFormat(TAG, { minimumFractionDigits: 2 }).format(0) + '%'
  : (p > 0 ? '+' : '-') + new Intl.NumberFormat(TAG, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(p)) + '%';
const signed = v => (v < 0 ? '−' : '+') + fmtCur(Math.abs(v));
const f = (s, ...a) => s.replace(/%(\d)\$[sd]/g, (_, i) => a[i - 1]).replace(/%d/g, a[0]);
const num = (v, d) => new Intl.NumberFormat(TAG, { maximumFractionDigits: d }).format(v);

// Uygulamanın çizgi ikon seti (res/drawable/ic_*.xml ile aynı yollar, 1.8 kalınlık)
const P = {
  home: 'M3.5 10.5L12 3.5L20.5 10.5M5.5 9V20H10V14.5H14V20H18.5V9',
  markets: 'M6 19V13M12 19V5M18 19V9M3.5 21H20.5',
  explore: 'M3 12A9 9 0 1 1 21 12A9 9 0 1 1 3 12ZM15.5 8.5L13.6 13.6L8.5 15.5L10.4 10.4Z',
  portfolio: 'M11 3.6A8.6 8.6 0 1 0 20.4 13H11ZM14 3.2A7.6 7.6 0 0 1 20.8 10H14Z',
  profile: 'M8 8A4 4 0 1 1 16 8A4 4 0 1 1 8 8ZM4.5 20.5C4.5 16.6 7.9 14.5 12 14.5C16.1 14.5 19.5 16.6 19.5 20.5',
  search: 'M4 11A7 7 0 1 1 18 11A7 7 0 1 1 4 11ZM16.2 16.2L20.5 20.5',
  bell: 'M6 16.5V11A6 6 0 0 1 18 11V16.5L19.5 18.5H4.5ZM10 21H14',
  tune: 'M4 7H13M19 7H20M4 17H5M11 17H20M13.5 7A2.5 2.5 0 1 1 18.5 7A2.5 2.5 0 1 1 13.5 7ZM5.5 17A2.5 2.5 0 1 1 10.5 17A2.5 2.5 0 1 1 5.5 17Z',
  star: 'M12 3.2L14.6 8.6L20.5 9.3L16.1 13.4L17.3 19.3L12 16.4L6.7 19.3L7.9 13.4L3.5 9.3L9.4 8.6Z',
  chev: 'M9.5 6L15.5 12L9.5 18',
  up: 'M3 17L9 11L13 15L21 7M15 7H21V13', down: 'M3 7L9 13L13 9L21 17M15 17H21V11', vol: 'M3.5 20.5H20.5M7 17V12M12 17V7M17 17V10',
  aup: 'M12 18V6M6.5 11.5L12 6L17.5 11.5', adn: 'M12 6V18M6.5 12.5L12 18L17.5 12.5', minus: 'M6 12H18', sort: 'M8 5V19M4.5 8.5L8 5L11.5 8.5M16 19V5M12.5 15.5L16 19L19.5 15.5',
  back: 'M19 12H5M11 6L5 12L11 18', close: 'M6 6L18 18M18 6L6 18', plus: 'M12 5V19M5 12H19', more: 'M12 5.5V5.6M12 12V12.1M12 18.5V18.6',
  line: 'M3.5 17L9 11L13 14.5L20.5 7', lang: 'M3 12A9 9 0 1 1 21 12A9 9 0 1 1 3 12ZM3 12H21M12 3C8.8 6.2 8.8 17.8 12 21C15.2 17.8 15.2 6.2 12 3',
  cur: 'M3 6.5H21V17.5H3ZM9.4 12A2.6 2.6 0 1 1 14.6 12A2.6 2.6 0 1 1 9.4 12Z', theme: 'M3 12A9 9 0 1 1 21 12A9 9 0 1 1 3 12ZM12 3V21',
  palette: 'M12 3.5C12 3.5 6 10.2 6 14.5A6 6 0 0 0 18 14.5C18 10.2 12 3.5 12 3.5Z', nset: 'M6 16.5V11A6 6 0 0 1 18 11V16.5L19.5 18.5H4.5ZM10 21H14M17 3.5L20.5 6',
  wifi: 'M5 10.5A10 10 0 0 1 19 10.5M8 13.8A6 6 0 0 1 16 13.8M12 17.5V17.6', bat: 'M6 8H17V16H6ZM19 11V13',
};
const ic = (n, cls, mirror) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24"' + (mirror && L.rtl ? ' style="transform:scaleX(-1)"' : '') + '><path d="' + P[n] + '"/></svg>';
const LOGO = sz => '<svg viewBox="27 27 54 54" width="' + sz + '" height="' + sz + '"><path d="M73.03 45.13A21 21 0 1 1 62.87 34.97" fill="none" stroke="#6E63DB" stroke-width="5.5" stroke-linecap="round"/><path d="M49.8 58.2L66.7 41.3" stroke="#6E63DB" stroke-width="4.5" stroke-linecap="round"/><path d="M51.2 56.8L46.9 69.6L45.5 62.5L38.4 61.1Z" fill="#6E63DB"/><path d="M76.6 31.4L71.7 47.6L60.4 36.3Z" fill="#2FD180"/></svg>';
const ICONAPP = '<svg viewBox="18 18 72 72" width="58" height="58"><defs><linearGradient id="ag" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4F6BFF"/><stop offset="1" stop-color="#7B3FE4"/></linearGradient><clipPath id="ac"><circle cx="54" cy="54" r="36"/></clipPath></defs><g clip-path="url(#ac)"><rect width="108" height="108" fill="url(#ag)"/></g><path d="M73.03 45.13A21 21 0 1 1 62.87 34.97" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M49.8 58.2L66.7 41.3" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M51.2 56.8L46.9 69.6L45.5 62.5L38.4 61.1Z" fill="#fff"/><path d="M76.6 31.4L71.7 47.6L60.4 36.3Z" fill="#2FD180"/></svg>';

const coin = s => DATA.coins.find(c => c.base === s);
const chg = c => (c.last - c.open) / c.open * 100;
// Logo yoksa uygulamadaki gibi baş harfli nötr yer tutucu
const icon = (b, sz) => DATA.icons[b] ? '<img class="ico" src="' + DATA.icons[b] + '" alt=""' + (sz ? ' style="width:' + sz + 'px;height:' + sz + 'px"' : '') + '>' : '<div class="ph">' + b.slice(0, 3) + '</div>';
const status = () => '<div class="status"><span>9:41</span><span class="ic">' + ic('wifi').replace('class="i"', 'class="i" style="width:16px;height:16px"') + ic('bat').replace('class="i"', 'class="i" style="width:18px;height:18px"') + '</span></div>';
const pill = p => '<span class="pill ' + (dir(p) > 0 ? 'up' : dir(p) < 0 ? 'dn' : 'nt') + '">' + pct(p) + '</span>';
const nav = on => '<div class="nav">' + [['home', S.nav_home], ['markets', S.nav_markets], ['explore', S.nav_explore], ['portfolio', S.portfolio], ['profile', S.nav_profile]]
  .map((t, i) => '<div' + (i === on ? ' class="on"' : '') + '>' + ic(t[0]) + '<span>' + t[1] + '</span></div>').join('') + '</div>';
const periods = on => '<div class="per">' + [S.period_5m, S.period_15m, S.period_1h, S.period_4h, S.period_24h, S.period_7d]
  .map((p, i) => '<div' + (i === on ? ' class="on"' : '') + '>' + p + '</div>').join('') + '</div>';
function spark(pts, p) {
  if (!pts || pts.length < 2) return '<svg class="sp"></svg>';
  let lo = Math.min(...pts), hi = Math.max(...pts);
  const mid = (lo + hi) / 2, minR = Math.abs(mid) * 0.01; // uygulamadaki gibi en az %1'lik ölçek
  if (hi - lo < minR) { lo = mid - minR / 2; hi = mid + minR / 2; }
  const d = pts.map((v, i) => (1.5 + i * 45 / (pts.length - 1)).toFixed(1) + ',' + (1.5 + (hi - v) / (hi - lo) * 21).toFixed(1)).join(' ');
  return '<svg class="sp" viewBox="0 0 48 24"><polyline points="' + d + '" fill="none" stroke="' + (dir(p) > 0 ? '#2FD180' : dir(p) < 0 ? '#FF5C70' : '#8C93A6') + '" stroke-width="1.5" stroke-linejoin="round"/></svg>';
}
function coinRow(c, p, fav) {
  return '<div class="row">' + icon(c.base) + '<div class="who"><div class="sym">' + c.base + '</div><div class="sub">' + f(S.volume_short, compact(c.qv)) + '</div></div>' +
    spark(c.spark, p) + '<div class="val"><div class="px">' + price(c.last) + '</div>' + pill(p) + '</div>' +
    '<div class="star' + (fav ? ' on' : '') + '">' + ic('star') + '</div></div>';
}

// 1 · Ana Sayfa: genel görünüm, piyasa hareketi, yükselenler ön izlemesi
function screenHome() {
  const ov = b => { const c = coin(b); return '<div class="c"><div class="s">' + icon(b, 20) + b + '</div><div class="p">' + price(c.last) + '</div>' + pill(chg(c)) + '</div>'; };
  const [up, dn, fl] = DATA.movement, total = up + dn + fl;
  const cell = (n, k, col, l) => '<div><div class="n" style="color:' + col + '">' + ic(k) + n + '</div><div class="cap2">' + l + '</div></div>';
  let rows = '';
  DATA.gainers24.forEach(c => rows += coinRow(c, chg(c), false));
  return status() + '<div class="hdr"><div class="logo">' + LOGO(28) + S.app_name + '</div><div class="ib">' + ic('search') + '</div><div class="ib">' + ic('bell') + '</div></div>' +
    '<div class="pad cap2">● ' + f(S.status_live, DATA.pairs).replace(/^●\s*/, '') + '</div>' +
    '<div class="card ov" style="flex-direction:column;padding:14px 0"><div class="cap2" style="padding:0 16px 8px">' + S.market_overview + '</div><div style="display:flex">' + ov('BTC') + ov('ETH') + '</div></div>' +
    '<div class="mvh"><div><div class="sec">' + S.market_movement + '</div><div class="cap2">' + f(S.movement_basis, S.period_24h, total) + '</div></div>' + ic('chev', '', true) + '</div>' +
    '<div class="card mv">' + cell(up, 'aup', '#2FD180', S.movement_up) + cell(dn, 'adn', '#FF5C70', S.movement_down) + cell(fl, 'minus', '#8C93A6', S.movement_flat) + '</div>' +
    '<div class="chips" style="margin-top:16px"><div class="chip on">' + ic('up') + S.tab_gainers + '</div><div class="chip">' + ic('down') + S.tab_losers + '</div><div class="chip">' + ic('vol') + S.tab_all + '</div></div>' +
    periods(4) + '<div style="margin-top:4px">' + rows + '</div>' + nav(0);
}

// 2 · Piyasalar: Yükselenler, 1 saatlik dönem
function screenMarkets() {
  let rows = '';
  DATA.hour.forEach((c, i) => rows += coinRow(c, c.ch1h, i === 2));
  return status() + '<div class="hdr"><div class="t">' + S.nav_markets + '</div><div class="ib">' + ic('search') + '</div><div class="ib">' + ic('tune') + '</div></div>' +
    '<div class="chips"><div class="chip">' + ic('vol') + S.tab_all + '</div><div class="chip">' + ic('star') + S.tab_favorites + '</div><div class="chip on">' + ic('up') + S.tab_gainers + '</div><div class="chip">' + ic('down') + S.tab_losers + '</div></div>' +
    periods(2) + '<div class="cols"><div>' + S.col_coin + '</div><div>' + S.col_price + ic('sort') + '</div><div>' + f(S.col_change, S.period_1h) + ic('sort') + '</div></div>' + rows + nav(1);
}

function chartSvg(w, h) {
  const K = DATA.candles.slice(-48), n = K.length;
  let lo = Infinity, hi = -Infinity, vm = 0;
  K.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); vm = Math.max(vm, k.v); });
  const pad = (hi - lo) * 0.08; lo -= pad * 3.2; hi += pad; // alt %35: hacim
  const plotW = w - 58, x = i => 4 + (i + 0.5) * plotW / n, y = v => h - 22 - (v - lo) / (hi - lo) * (h - 30);
  let g = '', ax = '';
  for (let i = 0; i < 5; i++) {
    const v = lo + (hi - lo) * (0.35 + i * 0.16), yy = y(v);
    g += '<line x1="0" x2="' + plotW + '" y1="' + yy + '" y2="' + yy + '" stroke="rgba(255,255,255,.10)" stroke-width="0.6"/>';
    ax += '<text x="' + (plotW + 6) + '" y="' + (yy + 3.5) + '" font-size="9.5" fill="#8C93A6">' + num(v * RATE, v * RATE >= 1000 ? 0 : 2) + '</text>';
  }
  let c = '';
  const bw = plotW / n * 0.72;
  K.forEach((k, i) => {
    const up = k.c >= k.o, col = up ? '#2FD180' : '#FF5C70', cx = x(i);
    const vh = k.v / vm * (h * 0.25);
    c += '<rect x="' + (cx - bw / 2) + '" y="' + (h - 22 - vh) + '" width="' + bw + '" height="' + vh + '" fill="' + col + '" opacity=".33"/>';
    c += '<line x1="' + cx + '" x2="' + cx + '" y1="' + y(k.h) + '" y2="' + y(k.l) + '" stroke="' + col + '" stroke-width="1"/>';
    c += '<rect x="' + (cx - bw / 2) + '" y="' + y(Math.max(k.o, k.c)) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(y(k.o) - y(k.c))) + '" fill="' + col + '"/>';
  });
  const tf = new Intl.DateTimeFormat(TAG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  let xl = '';
  [6, 20, 34].forEach(i => { xl += '<text x="' + x(i) + '" y="' + (h - 6) + '" font-size="9.5" fill="#8C93A6" text-anchor="middle">' + tf.format(new Date(K[i].t)) + '</text>'; });
  return '<svg width="' + w + '" height="' + h + '" style="direction:ltr">' + g + c + ax + xl + '</svg>';
}
function roundTo() { const v = coin('BTC').last * RATE; return Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 2)); }

// 3 · Coin detayı: fiyat + dönem rozeti, performans şeridi, istatistikler, grafik, alarmlar (+ gelen bildirim)
function screenDetail() {
  const c = coin('BTC'), pf = DATA.perf;
  const keys = [['M5', S.period_5m], ['M15', S.period_15m], ['H1', S.period_1h], ['H4', S.period_4h], ['D1', S.period_24h], ['D7', S.period_7d], ['D30', S.period_30d]];
  const ch = k => (c.last - pf[k]) / pf[k] * 100;
  const perf = keys.map(([k, l]) => '<div' + (k === 'D1' ? ' class="on"' : '') + '><div class="l">' + l + '</div><div class="v" style="color:' + (dir(ch(k)) > 0 ? '#2FD180' : dir(ch(k)) < 0 ? '#FF5C70' : '#8C93A6') + '">' + pct(ch(k)) + '</div></div>').join('');
  const r = roundTo(), tAbove = Math.ceil(c.last * RATE * 1.0012 / r) * r, tBelow = Math.floor(c.last * RATE * 0.95 / r) * r, now = tAbove * 1.0004;
  const note = '<div class="note"><div class="h">' + LOGO(16) + '<span>Coinvane · ' + S.alert_channel_name + '</span></div>' +
    '<div class="nt">' + f(S.alert_title, 'BTC') + '</div><div class="nb">' + f(S.alert_text_above, fmtCur(tAbove), fmtCur(now)) + '</div></div>';
  const achip = (t, s) => '<div class="achip">' + f(s, fmtCur(t)) + ic('close') + '</div>';
  return note + status() + '<div class="tb"><div class="ib">' + ic('back', '', true) + '</div><div class="tt"><div class="t1">' + c.name + '</div><div class="t2">BTC</div></div><div class="ib star on">' + ic('star') + '</div></div>' +
    '<div class="pad"><div class="hero">' + icon('BTC', 40) + '<div><div class="big">' + price(c.last) + '</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px">' + pill(chg(c)) + '<span class="cap2">' + f(S.change_period, S.period_24h) + '</span></div></div></div>' +
    '<div class="cap2" style="margin-top:14px">' + S.performance + '</div><div class="card perf">' + perf + '</div>' +
    '<div class="card stats"><div class="stat"><div class="l">' + S.high_24h + '</div><div class="v">' + price(c.high) + '</div></div>' +
    '<div class="stat"><div class="l">' + S.low_24h + '</div><div class="v">' + price(c.low) + '</div></div>' +
    '<div class="stat"><div class="l">' + S.volume_24h + '</div><div class="v">' + compact(c.qv) + '</div></div></div>' +
    '<div class="ints"><div class="seg"><div>' + S.interval_15m + '</div><div class="on">' + S.interval_1h + '</div><div>' + S.interval_4h + '</div><div>' + S.interval_1d + '</div><div>' + S.interval_1w + '</div></div><div class="ib">' + ic('line') + '</div></div>' +
    '<div class="chartbox">' + chartSvg(CW, TABLET ? 150 : 210) + '</div>' +
    '<div class="cap2" style="margin-top:8px">' + S.alerts_title + '</div><div class="achips">' + achip(tBelow, S.alert_chip_below) + achip(Math.round(c.last * RATE * 1.06 / r) * r, S.alert_chip_above) + '</div>' +
    '<div class="btn prim">' + ic('bell') + S.set_alert + '</div></div>';
}

// 4 · Portföy: toplam bakiye, 24s değişim ve toplam K/Z ayrı satırlarda
function screenPortfolio() {
  let val = 0, cost = 0, ch = 0, rows = '';
  const hs = DATA.portfolio.map(h => { const c = coin(h.base); return { h, c, v: h.amount * c.last }; }).sort((a, b) => b.v - a.v);
  hs.forEach(({ h, c, v }) => {
    val += v; cost += h.amount * h.cost; ch += h.amount * (c.last - c.open);
    rows += '<div class="row">' + icon(c.base) + '<div class="who"><div class="sym">' + c.base + '</div><div class="sub">' + f(S.holding_amount_value, num(h.amount, 8), c.base) + '</div></div>' +
      '<div class="val"><div class="px">' + price(v) + '</div>' + pill((c.last - h.cost) / h.cost * 100) + '</div><div class="star">' + ic('more') + '</div></div>';
  });
  const prof = val - cost, prev = val - ch;
  const kv = (l, v, p) => '<div class="kv">' + l + '<b style="color:' + (dir(p) > 0 ? '#2FD180' : dir(p) < 0 ? '#FF5C70' : '#8C93A6') + '">' + f(S.amount_percent, signed(v * RATE), pct(p)) + '</b></div>';
  return status() + '<div class="hdr"><div class="t">' + S.portfolio + '</div></div>' +
    '<div class="card sum"><div class="top"><div>' + S.portfolio_total + '</div><div>' + CODE + '</div></div><div class="v">' + price(val) + '</div><hr>' +
    kv(S.change_24h_label, ch, ch / prev * 100) + kv(S.total_pl_label, prof, prof / cost * 100) + '</div>' +
    '<div class="tabs"><div class="chip on">' + S.assets + '</div><div class="chip">' + S.allocation + '</div><div class="add">' + ic('plus') + S.add_asset + '</div></div>' + rows + nav(3);
}

// 5 · Ana ekran widget'ı
function screenWidget() {
  const tf = new Intl.DateTimeFormat(TAG, { hour: '2-digit', minute: '2-digit' });
  const df = new Intl.DateTimeFormat(TAG, { weekday: 'long', day: 'numeric', month: 'long' });
  const d = new Date(DATA.time); d.setHours(9, 41, 0, 0); // durum çubuğuyla aynı saat
  let w = '';
  ['BTC', 'ETH', 'SOL', 'XRP'].map(coin).forEach(c => {
    const p = chg(c);
    w += '<div class="wr"><span class="b">' + c.base + '</span><span class="p">' + price(c.last) + '</span><span class="c" style="color:' + (dir(p) > 0 ? '#2FD180' : dir(p) < 0 ? '#FF5C70' : '#8C93A6') + '">' + pct(p) + '</span></div>';
  });
  let apps = '';
  for (let i = 0; i < 8; i++) apps += i === 5 ? '<div class="appi cv">' + ICONAPP + '</div>' : '<div class="appi"></div>';
  return '<div class="home">' + status() + '<div class="clock">' + tf.format(d) + '</div><div class="date">' + df.format(d) + '</div>' +
    '<div class="widget"><div class="wh">' + LOGO(18).replace(/#6E63DB/g, '#9A91F5') + '<span>Coinvane</span><span class="tm">' + tf.format(d) + '</span></div>' + w + '</div>' +
    '<div class="grid">' + apps + '</div><div class="dock"><div class="appi"></div><div class="appi"></div><div class="appi"></div><div class="appi"></div></div></div>';
}

// 6 · Profil: tercihler (para birimi seçimi açık)
function screenProfile() {
  const dn = new Intl.DisplayNames([TAG], { type: 'currency' });
  const sym = code => (new Intl.NumberFormat(TAG, { style: 'currency', currency: code }).formatToParts(0).find(p => p.type === 'currency') || {}).value;
  const label = code => code + ' · ' + dn.of(code) + ' (' + sym(code) + ')';
  const list = [CODE].concat(['USD', 'EUR', 'GBP', 'TRY', 'JPY', 'KRW', 'BRL', 'INR'].filter(c => c !== CODE)).slice(0, 7);
  list.sort((a, b) => DATA.currencies.indexOf(a) - DATA.currencies.indexOf(b));
  let opts = '';
  list.forEach(c => opts += '<div class="opt"><div class="radio' + (c === CODE ? ' on' : '') + '"></div>' + label(c) + '</div>');
  const row = (i, k, v) => '<div class="set">' + ic(i) + '<div class="k">' + k + '</div>' + (v ? '<div class="v">' + v + '</div>' : '') + ic('chev', 'ch', true) + '</div>';
  return status() + '<div class="hdr"><div class="t">' + S.nav_profile + '</div></div>' +
    '<div class="gl">' + S.section_preferences + '</div><div class="card grp">' + row('lang', S.settings_language, L.languageName) + row('cur', S.settings_currency, label(CODE)) +
    row('theme', S.settings_theme, S.theme_options[2]) + '</div>' +
    '<div class="gl">' + S.section_notifications + '</div><div class="card grp">' + row('bell', S.price_alerts, f(S.alerts_active, 2)) + row('nset', S.notification_settings, '') + '</div>' +
    '<div class="scrim"></div><div class="dlg"><h3>' + S.settings_currency + '</h3>' + opts + '</div>' + nav(4);
}

const SCREENS = [screenHome, screenMarkets, screenDetail, screenPortfolio, screenWidget, screenProfile];
document.getElementById('app').innerHTML = SCREENS[SHOT - 1]();
document.getElementById('h').textContent = L.captions[SHOT - 1][0];
document.getElementById('p').textContent = L.captions[SHOT - 1][1];
</script>
