plugins {
    id 'com.android.application'
}

// Crashlytics: Firebase projesinin google-services.json dosyası app/ altına konunca kendiliğinden açılır.
def firebaseEnabled = file('google-services.json').exists()
if (firebaseEnabled) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace = 'com.abraxel.cryptocurrency'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.abraxel.cryptocurrency'
        minSdk = 26
        targetSdk = 37
        versionCode = 24
        versionName = '7.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // İmza bilgileri repoda tutulmaz: kök dizindeki keystore.properties'ten okunur.
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    androidResources {
        generateLocaleConfig = true // Android 13+ sistem ayarlarında uygulama dili seçimi
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'com.google.android.play:review:2.0.2' // uygulama içi puanlama // baseline-prof.txt'yi cihaza kurar

    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:35.1.0')
        implementation 'com.google.firebase:firebase-crashlytics'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814' // android.jar'daki org.json stub'larının yerine gerçek uygulama
}
